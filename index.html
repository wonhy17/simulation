<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시뮬레이션 실험 고정값</title><link rel="stylesheet" href="styles.css"></head><body>
<section id="loginScreen" class="login-screen"><div class="login-card"><div class="login-mark">S</div><h1>시뮬레이션 실험 고정값</h1><p>AS-IS와 TO-BE 비교 조건을 팀과 함께 관리합니다.</p><button id="loginBtn" class="primary login-button">Google 계정으로 로그인</button><small>로그인 후 저장된 실험 버전을 사용할 수 있습니다.</small></div></section>
<section id="appScreen" hidden><header class="top"><div class="topbar"><div class="title"><h1>실험 고정값</h1><p>하나의 실험 동안 동일하게 유지할 조건</p></div><div class="actions"><span id="authStatus"></span><button id="logoutBtn">로그아웃</button><button id="newBtn">새로 만들기</button><button id="settingsBtn">설정</button><button id="saveBtn" class="primary">저장</button></div></div><div class="version"><strong id="versionLabel">새 실험안</strong><input id="name" placeholder="버전 이름 예: 기준 시나리오"></div></header>
<main class="layout"><section class="fixed"><div class="fixed-title">실험 공통 고정값</div><div class="grid"><section class="panel"><h2>창고 스펙</h2><div class="panel-inner"><h3>공간·랙·재고</h3><div class="fields"><div class="field" data-field-id="warehouseSize"><label>창고 크기</label><input data-key="warehouseSize" placeholder="예: 40 × 25 m"></div><div class="field" data-field-id="clearHeight"><label>유효 높이</label><input data-key="clearHeight" placeholder="예: 8 m"></div><div class="field" data-field-id="rackSpec"><label>랙 구성</label><input data-key="rackSpec" placeholder="열·모듈·칸·단·깊이"></div><div class="field" data-field-id="aisle"><label>통로 폭</label><input data-key="aisle" placeholder="예: 1.2 m"></div><div class="field" data-field-id="inventory"><label>SKU / 초기 재고</label><input data-key="inventory" placeholder="예: 3,000 SKU / 점유율 80%"></div><div class="field" data-field-id="tote"><label>토트 규격·용량</label><input data-key="tote" placeholder="예: 600×400×300 mm / 1회 1개"></div><div class="field" data-field-id="carton"><label>카톤 조건</label><input data-key="carton" placeholder="규격·상품 수·전체 출고 여부"></div><div class="field" data-field-id="buffer"><label>하부 버퍼</label><input data-key="buffer" placeholder="출고·반환 자리 / 용량 / 만석 규칙"></div><div class="field" data-field-id="queue"><label>스테이션 대기</label><input data-key="queue" placeholder="스테이션당 대기 대수"></div></div></div></section>
<section class="panel"><h2>기기 스펙</h2><div class="panel-inner"><h3>ACR·AMR·작업자</h3><div class="fields"><div class="field" data-field-id="acr"><label>ACR 대수·속도</label><input data-key="acr" placeholder="예: 4대 / 1.5 m/s"></div><div class="field" data-field-id="acrLift"><label>ACR 승강</label><input data-key="acrLift" placeholder="속도·가감속"></div><div class="field" data-field-id="acrLoad"><label>ACR 운반량</label><input data-key="acrLoad" placeholder="예: 토트 1개 / 적재 한도"></div><div class="field" data-field-id="amr"><label>AMR 대수·속도</label><input data-key="amr" placeholder="예: 3대 / 1.2 m/s"></div><div class="field" data-field-id="amrLoad"><label>AMR 운반량</label><input data-key="amrLoad" placeholder="예: 토트 1개 / 적재 한도"></div><div class="field" data-field-id="dispatch"><label>AMR 배차 규칙</label><input data-key="dispatch" placeholder="호출·우선순위·복귀"></div><div class="field" data-field-id="charge"><label>충전·가동 조건</label><input data-key="charge" placeholder="충전기 수 / SOC / 충전시간"></div><div class="field" data-field-id="station"><label>피킹 스테이션</label><input data-key="station" placeholder="예: 4개 / 1명씩"></div><div class="field" data-field-id="times"><label>작업시간 기준</label><input data-key="times" placeholder="인출·운반·피킹·반환 시간 근거"></div></div></div></section></div>
<section class="panel orders"><h2>주문 스펙</h2><div class="panel-inner"><h3>수요·처리 규칙·실험 기준</h3><div class="fields"><div class="field" data-field-id="orderType"><label>B2B / B2C 비율</label><input data-key="orderType" placeholder="예: 50% / 50%"></div><div class="field" data-field-id="orderCount"><label>총 주문량</label><input data-key="orderCount" placeholder="예: 1,000건 / 실험"></div><div class="field" data-field-id="orderMix"><label>주문당 상품·SKU</label><input data-key="orderMix" placeholder="예: 20개 / 6 SKU"></div><div class="field" data-field-id="arrival"><label>주문 도착 방식</label><input data-key="arrival" placeholder="일괄·주기·분포 / 시간대"></div><div class="field" data-field-id="priority"><label>납기·우선순위</label><input data-key="priority" placeholder="FIFO·납기 임박 우선 등"></div><div class="field" data-field-id="batch"><label>주문 묶음·토트 재사용</label><input data-key="batch" placeholder="웨이브·묶음 기준"></div><div class="field" data-field-id="pickRule"><label>피킹 규칙</label><input data-key="pickRule" placeholder="낱개·묶음·카톤 전체"></div><div class="field" data-field-id="scope"><label>모델 경계</label><input data-key="scope" placeholder="입고 제외 / 출고·피킹·반환 포함"></div><div class="field" data-field-id="endRule"><label>종료 기준</label><input data-key="endRule" placeholder="전량 처리 또는 고정 운영시간"></div><div class="field" data-field-id="common"><label>AS-IS / TO-BE 공통 조건</label><input data-key="common" placeholder="주문·재고·배치·작업자 동일"></div><div class="field" data-field-id="kpi"><label>핵심 KPI</label><input data-key="kpi" placeholder="처리량·완료시간·대기·이용률"></div><div class="field" data-field-id="repeat"><label>반복·난수 조건</label><input data-key="repeat" placeholder="반복 횟수·워밍업·시드"></div></div></div></section><p class="help">입력값은 저장할 때 새 버전으로 보존됩니다. 설정에서 기본 항목도 삭제하거나 새 항목을 추가할 수 있습니다.</p></section><section class="history"><h2>저장된 버전</h2><div id="history" class="history-list"></div></section></main></section>
<dialog id="settingsDialog"><form method="dialog"><h2>입력 항목 설정</h2><p class="help">기본 항목과 추가 항목을 관리합니다.</p><div id="fieldManager"></div><div class="manager-add"><input id="addLabel" placeholder="새 항목 이름"><button type="button" id="addField">항목 추가</button></div><button value="cancel">닫기</button></form></dialog><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script></body></html>
